# ==================================================================
# XIAO Soil Moisture Monitor - shared base (include, not a device)
# Included via `packages:` by xiao-soil-moisture-monitor-{1..6}.yaml
# Each stub supplies: name, friendly_name, static_ip  (dry/wet optional)
#
# Hardware : Seeed XIAO ESP32-C6 + Seeed soil-moisture carrier board
# Antenna  : EXTERNAL u.FL (GPIO3 low = RF switch on, GPIO14 high = ext)
# Transport: MQTT, deep-sleep "report-then-sleep" pattern
# ==================================================================

substitutions:
  dry_init: "2.75"          # default calibration seeds; override per device
  wet_init: "1.2"
  stuck_backoff_ms: "14400000"   # 4h timer-only backoff once the rewake guard trips
  # Compiled default for the persistent MQTT setting. Set "false" in a device
  # stub to start with the guard disabled; RESET restores this value.
  rewake_guard_default: "true"
  # Sleep interval per classified state. Override in a device stub to retune.
  # Cost is computable: wakes/day = 86400 / (interval_ms / 1000).
  sleep_normal_ms:     "7200000"    #  2 h - detect Almost Dry within 2 h
  sleep_almost_dry_ms: "3600000"    #  1 h - detect Dry within 1 h
  sleep_dry_ms:       "14400000"    #  4 h - confirm watering within 4 h
  # "true" = external u.FL antenna (shipped attached). "false" = built-in
  # ceramic antenna, for a board with the u.FL antenna removed.
  external_antenna:       "true"
  # A wake that never reaches MQTT is pure waste: the radio retries at full
  # power and nothing is published. Sleep as soon as a report is clearly not
  # coming, then back off, so a router/broker outage costs a few wakes a day
  # instead of a full retry window every interval.
  report_timeout_ms:      "20000"      # 20 s; a healthy wake reports in ~3 s
  # Keep the ceiling under whatever staleness alert watches these nodes, so a
  # node that recovers is not still asleep when the alert fires.
  max_offline_sleep_ms:   "21600000"   #  6 h backoff ceiling
  # Absolute cap on one wake. Outranks EVERY hold, including a wedged ota_hold.
  # Should never fire: ota_hold self-releases at 10 min, usb_hold at 5 min.
  # Sized as the longest legitimate hold plus an equal margin, so the two
  # timers cannot race. Worst-case waste if it ever does fire is ~65 mAh,
  # roughly 3% of an AA, against the whole cell if nothing capped a wedge.
  max_awake_ms:           "1200000"    # 20 min

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false        # stable hostname/topics for static IP + OTA
  includes:
    - packages/usb_host_detect.h    # debounced SOF-counter USB host check
    - packages/battery_curve.h      # alkaline_aa_percent(): AA discharge curve
    - packages/soil_monitor_helpers.h
    - packages/soil_settings.h         # generic SET/RESET settings command parser
  project:
    name: "xiao.soil-moisture-monitor"
    # Fleet firmware release, reported in MQTT discovery / HA device sw_version.
    # Bump for every source change that can be deployed independently.
    version: "1.5.2"
  on_boot:
    # Sensors initialize at 600 and WiFi at 250. Run just after sensor setup but
    # before radio startup so battery voltage and die temperature are captured
    # at the same repeatable, low-load point in every wake.
    priority: 599
    then:
      # --- Rewake safety: count GPIO wakes and failed GPIO wake reports ---
      # A wet/stuck button re-wakes the device the instant it sleeps (level-
      # triggered wake, wakeup_pin_mode IGNORE re-arms it). The configurable
      # guard handles completed report cycles. The unconditional failed-report
      # backstop still stops a no-WiFi loop when the configurable guard is off.
      # Timer/cold boots reset both counters.
      - lambda: |-
          auto cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_GPIO || cause == ESP_SLEEP_WAKEUP_EXT1) {
            id(gpio_wake_count) += 1;
            id(failed_gpio_wake_count) += 1;
          } else {
            id(gpio_wake_count) = 0;
            id(failed_gpio_wake_count) = 0;
          }
          ESP_LOGI(
              "rewake_guard",
              "wake cause=%d, consecutive GPIO wakes=%d, unreported=%d",
              (int) cause, id(gpio_wake_count), id(failed_gpio_wake_count));
          if (soil_failed_rewake_backoff(id(failed_gpio_wake_count))) {
            ESP_LOGW("rewake_guard", "%d GPIO re-wakes without a completed cycle - %llds timer-only backoff", id(failed_gpio_wake_count), (long long) (${stuck_backoff_ms} / 1000));
            esp_sleep_enable_timer_wakeup(${stuck_backoff_ms}ULL * 1000ULL);
            global_preferences->sync();
            esp_deep_sleep_start();
          }
      # --- XIAO ESP32-C6 antenna select (external u.FL) ---
      - output.turn_off: gpio_3_output     # GPIO3 LOW  -> enable RF switch (both antennas)
      - if:
          condition:
            lambda: 'return ${external_antenna};'
          then:
            - output.turn_on:  gpio_14_output   # GPIO14 HIGH -> external u.FL
          else:
            - output.turn_off: gpio_14_output   # GPIO14 LOW  -> built-in ceramic
      # --- soil-sensor drive / status PWM, on while awake ---
      - light.turn_on:
          id: pwm_led
          brightness: 68%
      - lambda: 'id(probe_powered) = true;'
      - script.execute: probe_idle_timeout
      - component.update: battery_voltage
      # After a 1-4h deep sleep the die has largely equilibrated with the local
      # enclosure. Read it before WiFi activity can self-heat the C6.
      - component.update: mcu_temperature
      # Arm both watchdogs before the radio starts, so their timeouts are
      # measured from a fixed point in every wake. Both use script delays
      # (set_timeout); an `interval:` would fire at a random offset instead.
      - script.execute: connect_watchdog
      - script.execute: awake_watchdog

esp32:
  board: seeed_xiao_esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# ---------- Pin map (silk / GPIO) ----------
# LED Yellow D10/18   LED Red D9/20   LED Green D8/19   Button D2/2
# Battery D0/0        PWM out D3/21    Soil D1/1
output:
  - platform: gpio
    pin: GPIO18
    id: yellow_led_output
  - platform: gpio
    pin: GPIO19
    id: green_led_output
  - platform: gpio
    pin: GPIO20
    id: red_led_output
  - platform: ledc
    pin: GPIO21
    id: pwm_output
    frequency: 200kHz
  - platform: gpio
    pin: GPIO3
    id: gpio_3_output
  - platform: gpio
    pin: GPIO14
    id: gpio_14_output

light:
  - platform: binary
    id: yellow_led
    output: yellow_led_output
  - platform: binary
    id: green_led
    output: green_led_output
  - platform: binary
    id: red_led
    output: red_led_output
  - platform: monochromatic
    output: pwm_output
    id: pwm_led
    internal: true
    default_transition_length: 0s

globals:
  - id: button_press_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: dry_value
    type: float
    restore_value: yes
    initial_value: '${dry_init}'
  - id: wet_value
    type: float
    restore_value: yes
    initial_value: '${wet_init}'
  - id: calibration_dry_candidate
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: calibration_wet_candidate
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: calibration_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: probe_powered
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ref_dry
    type: float
    restore_value: no
    initial_value: '0.23'
  - id: ref_wet
    type: float
    restore_value: no
    initial_value: '0.58'
  - id: ota_hold            # set by retained MQTT topic  ${name}/ota = "ON"
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: usb_hold            # true while an enumerated USB host holds us awake
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gpio_wake_count     # consecutive button/GPIO wakes; reset on timer/cold boot
    type: int
    restore_value: yes      # NVS - survives deep sleep
    initial_value: '0'
  - id: failed_gpio_wake_count  # unconditional no-report runaway backstop
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rewake_guard_enabled
    type: bool
    restore_value: yes      # runtime setting - survives deep sleep and power loss
    initial_value: '${rewake_guard_default}'
  - id: rewake_guard_discovery_migrated
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: settings_active     # retained settings command is being applied/persisted
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: next_sleep_ms       # mirrors set_sleep_duration for the guarded timer-only path
    type: int
    restore_value: no
    initial_value: '14400000'
  - id: report_ok           # this wake completed a full MQTT report
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: failed_report_streak  # consecutive wakes that never reached MQTT
    type: int
    restore_value: yes      # NVS - the backoff must survive deep sleep
    initial_value: '0'

script:
  # The probe is powered before WiFi so it is settled for the normal fast
  # report. If WiFi/MQTT is unavailable, report_and_sleep never samples it and
  # the 30 s run-duration cap would otherwise leave it powered the whole time.
  # A later connection is safe: check_moisture_once restores drive and waits
  # 500 ms before sampling. Never interrupt an active measurement/calibration.
  - id: probe_idle_timeout
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: |-
              return id(probe_powered) &&
                     !id(calibration_active) &&
                     !id(check_moisture_once).is_running();
          then:
            - light.turn_off: pwm_led
            - lambda: 'id(probe_powered) = false;'
            - logger.log:
                level: WARN
                format: "No report after 5 seconds - turning off idle probe drive"

  # ----------------- LED feedback -----------------
  - id: red_led_blink
    mode: restart
    then:
      - repeat:
          count: 10
          then:
            - light.turn_on: red_led
            - delay: 500ms
            - light.turn_off: red_led
            - delay: 500ms
  - id: green_led_blink
    mode: restart
    then:
      - repeat:
          count: 10
          then:
            - light.turn_on: green_led
            - delay: 500ms
            - light.turn_off: green_led
            - delay: 500ms
  - id: fast_blink_green
    then:
      - repeat:
          count: 5
          then:
            - light.turn_on: green_led
            - delay: 200ms
            - light.turn_off: green_led
            - delay: 200ms
  - id: fast_blink_red
    then:
      - repeat:
          count: 5
          then:
            - light.turn_on: red_led
            - delay: 200ms
            - light.turn_off: red_led
            - delay: 200ms
  - id: red_status_pulse
    then:
      - light.turn_on: red_led
      - delay: 1000ms
      - light.turn_off: red_led
      - delay: 100ms
  - id: yellow_status_pulse
    then:
      - light.turn_on: yellow_led
      - delay: 1000ms
      - light.turn_off: yellow_led
      - delay: 100ms
  # Green doubles as the USB-hold indicator (usb_hold_update), which is
  # edge-triggered and never re-asserts. Turning green off unconditionally here
  # left the indicator dark while the hold was still active, so only clear it
  # when no USB host is holding us awake.
  - id: green_status_pulse
    then:
      - light.turn_on: green_led
      - delay: 1000ms
      - if:
          condition:
            lambda: 'return !id(usb_hold);'
          then:
            - light.turn_off: green_led
      - delay: 100ms

  # ------- Read moisture, classify, set next sleep, publish -------
  - id: check_moisture_once
    mode: single
    then:
      - lambda: |-
          // The probe is already settled on a normal boot. During a manual
          // check after an OTA/USB hold, restore drive only for this sample.
          if (!id(probe_powered)) {
            auto call = id(pwm_led).turn_on();
            call.set_brightness(0.68f);
            call.perform();
            id(probe_powered) = true;
            delay(500);
          }

          float sum = 0.0f;
          bool samples_valid = true;
          for (int i = 0; i < 5; i++) {
            id(soil_adc).update();
            const float sample = id(soil_adc).state;
            if (std::isfinite(sample)) {
              sum += sample;
            } else {
              samples_valid = false;
            }
            delay(100);
          }
          const float moisture = samples_valid ? sum / 5.0f : NAN;

          // Never power the probe through WiFi retries or OTA/USB holds.
          id(pwm_led).turn_off().perform();
          id(probe_powered) = false;

          if (!std::isfinite(moisture) ||
              !soil_calibration_valid(id(dry_value), id(wet_value))) {
            id(soil_sensor_fault).publish_state(true);
            id(soil_status).publish_state("Sensor Fault");
            id(next_sleep_ms) = 3600000;  // retry in 1 h, without claiming "Normal"
            id(deep_sleep_control).set_sleep_duration(id(next_sleep_ms));
            ESP_LOGE("moisture",
                     "sensor/calibration fault: raw=%.3f dry=%.3f wet=%.3f",
                     moisture, id(dry_value), id(wet_value));
            return;
          }

          id(soil_sensor).publish_state(moisture);
          id(soil_sensor_fault).publish_state(false);
          float diff = id(dry_value) - id(wet_value);
          const char *status;
          if (moisture >= (id(dry_value) - diff * id(ref_dry))) {          // drier -> higher V
            id(red_status_pulse).execute();
            id(next_sleep_ms) = ${sleep_dry_ms};                  //  4 h    (dry)
            status = "Dry";
          } else if (moisture > (id(dry_value) - diff * id(ref_wet))) {
            id(yellow_status_pulse).execute();
            id(next_sleep_ms) = ${sleep_almost_dry_ms};           //  1 h    (almost dry)
            status = "Almost Dry";
          } else {
            id(green_status_pulse).execute();
            id(next_sleep_ms) = ${sleep_normal_ms};               //  2 h    (moist)
            status = "Normal Moisture";
          }
          id(deep_sleep_control).set_sleep_duration(id(next_sleep_ms));
          id(soil_status).publish_state(status);
          ESP_LOGI("moisture", "raw=%.3f -> %s", moisture, status);

  - id: publish_calibration_diagnostics
    then:
      - lambda: |-
          id(calibration_dry_sensor).publish_state(id(dry_value));
          id(calibration_wet_sensor).publish_state(id(wet_value));
          id(calibration_span_sensor).publish_state(id(dry_value) - id(wet_value));

  - id: publish_device_diagnostics
    then:
      - lambda: |-
          id(firmware_build_sensor).publish_state(soil_firmware_build());
          id(wake_reason_sensor).publish_state(
              soil_wake_reason(esp_sleep_get_wakeup_cause()));
          id(reset_reason_sensor).publish_state(
              soil_reset_reason(esp_reset_reason()));
          id(next_sleep_sensor).publish_state(id(next_sleep_ms) / 1000.0f);
          // Republish every report so the retained value is authoritative.
          // A node that dies holding leaves "ON" retained, which is what makes
          // a stuck hold visible in HA at all.
          id(usb_hold_active).publish_state(id(usb_hold));
      - switch.template.publish:
          id: rewake_guard_switch
          state: !lambda 'return id(rewake_guard_enabled);'

  - id: clear_rewake_guard_commands
    then:
      - mqtt.publish:
          topic: "${name}/settings/rewake_guard/command"
          payload: ""
          retain: true
      - mqtt.publish:
          topic: "${name}/settings/command"
          payload: ""
          retain: true

  - id: request_rewake_guard_setting

    mode: queued
    max_runs: 2
    parameters:
      enabled: bool
      source: std::string
    then:
      - if:
          condition:
            lambda: 'return id(settings_active) || id(calibration_active);'
          then:
            - lambda: |-
                char result[160];
                std::snprintf(
                    result, sizeof(result),
                    "Rejected %s: another settings/calibration update is active",
                    source.c_str());
                id(settings_result_sensor).publish_state(result);
                ESP_LOGW("settings", "%s", result);
            - switch.template.publish:
                id: rewake_guard_switch
                state: !lambda 'return id(rewake_guard_enabled);'
            - script.execute: clear_rewake_guard_commands
          else:
            - if:
                condition:
                  lambda: 'return id(rewake_guard_enabled) == enabled;'
                then:
                  - lambda: |-
                      char result[128];
                      std::snprintf(
                          result, sizeof(result),
                          "%s unchanged: REWAKE_GUARD=%s",
                          source.c_str(), enabled ? "ON" : "OFF");
                      id(settings_result_sensor).publish_state(result);
                      ESP_LOGI("settings", "%s", result);
                  - switch.template.publish:
                      id: rewake_guard_switch
                      state: !lambda 'return enabled;'
                  - script.execute: clear_rewake_guard_commands
                else:
                  - lambda: |-
                      id(settings_active) = true;
                      id(deep_sleep_control).prevent_deep_sleep();
                      id(rewake_guard_enabled) = enabled;
                      char result[128];
                      std::snprintf(
                          result, sizeof(result),
                          "%s saved: REWAKE_GUARD=%s",
                          source.c_str(), enabled ? "ON" : "OFF");
                      id(settings_result_sensor).publish_state(result);
                      ESP_LOGI("settings", "%s", result);
                  # Restored globals flush changed values every second.
                  - delay: 1200ms
                  - script.execute: publish_device_diagnostics
                  - script.execute: clear_rewake_guard_commands
                  - lambda: 'id(settings_active) = false;'
                  - if:
                      condition:
                        lambda: 'return !id(ota_hold) && !id(usb_hold) && !id(calibration_active);'
                      then:
                        - deep_sleep.allow: deep_sleep_control
                        # report_and_sleep can already be complete. Allow its
                        # publishes to flush, then close this wake explicitly.
                        - delay: 1500ms
                        - script.execute: enter_sleep
  - id: migrate_rewake_guard_discovery
    then:
      - if:
          condition:
            lambda: 'return !id(rewake_guard_discovery_migrated);'
          then:
            # v1.3.0 exposed a read-only text sensor with this object id.
            # Remove its retained discovery record when the config switch lands.
            - mqtt.publish:
                topic: "homeassistant/sensor/${name}/rewake_guard/config"
                payload: ""
                retain: true
            - lambda: 'id(rewake_guard_discovery_migrated) = true;'

  # ------- USB flash hold: stay awake while a USB host is attached -------
  # SOF-counter check (usb_host_detect.h) sees only enumerated hosts, never
  # chargers. Still a single lambda, so it completes inline and the caller can
  # read id(usb_hold) on the next action.
  #
  # ACQUIRE HAPPENS AT EXACTLY TWO POINTS, both once per wake:
  #   - report_and_sleep, after a successful report (the normal USB/OTA flow)
  #   - connect_watchdog, immediately before giving up on a failed wake, so a
  #     node with broken WiFi can still be caught for a USB flash
  # It used to be reachable from the 5 s interval, so every long broken-WiFi
  # wake rolled the detector ~5 more times. A single false positive disarms
  # run_duration (see usb_host_detect.h) and holds the node awake with the
  # radio powered until the cell is flat. Two strict (3-window) checks per wake
  # replace ~5 loose single-window ones, and usb_hold_timeout now bounds a
  # false hit to 5 minutes instead of forever.
  #
  # The 5 s interval keeps the RELEASE half, so unplugging still sleeps the
  # node promptly. When no hold is held the script now returns immediately,
  # which also removes the old unconditional 20 ms blocking poll every 5 s.
  - id: usb_hold_update
    parameters:
      allow_acquire: bool
    then:
      - lambda: |-
          if (!id(usb_hold)) {
            if (!allow_acquire || !usb_host_present_confirmed()) {
              return;
            }
            id(usb_hold) = true;
            ESP_LOGI("usb_hold",
                     "USB host confirmed - holding device awake for flashing");
            id(deep_sleep_control).prevent_deep_sleep();
            id(green_led).turn_on().perform();
            id(usb_hold_active).publish_state(true);
            id(usb_hold_timeout).execute();
            return;
          }
          if (usb_host_still_present()) {
            return;
          }
          id(usb_hold) = false;
          ESP_LOGI("usb_hold", "USB host gone - releasing hold");
          id(usb_hold_timeout).stop();
          id(green_led).turn_off().perform();
          id(usb_hold_active).publish_state(false);
          if (!id(ota_hold) && !id(calibration_active) && !id(settings_active)) {
            id(deep_sleep_control).allow_deep_sleep();
            id(enter_sleep).execute();
          }

  # A USB hold is bounded exactly like the OTA hold. On a genuine USB session
  # the re-check renews it indefinitely at zero battery cost - the board is
  # bus-powered - so flashing and debugging are unaffected. A hold taken on a
  # false positive costs one interval instead of the whole cell.
  - id: usb_hold_timeout
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(usb_hold);'
          then:
            - delay: 5min
            - if:
                condition:
                  lambda: 'return id(usb_hold) && !usb_host_present_confirmed();'
                then:
                  - lambda: |-
                      id(usb_hold) = false;
                      ESP_LOGW("usb_hold",
                               "USB hold timed out with no live host - releasing");
                      id(green_led).turn_off().perform();
                      id(usb_hold_active).publish_state(false);
                  - if:
                      condition:
                        lambda: 'return !id(ota_hold) && !id(calibration_active) && !id(settings_active);'
                      then:
                        - deep_sleep.allow: deep_sleep_control
                        - script.execute: enter_sleep

  # ---- No-WiFi / no-broker escape ----
  # Without this the only exit from a failed wake is the 30 s run_duration cap,
  # so a miss costs several times what a successful report costs. Leaving early
  # cuts that, and the streak backoff stops a multi-hour outage from buying a
  # full retry window every interval.
  #
  # Deliberately skipped while report_and_sleep is running: a slow-but-working
  # wake must be allowed to finish. If that path itself wedges, run_duration
  # (no hold) or awake_watchdog (hold) closes the wake.
  #
  # ALSO skipped on a pending-verify (post-OTA) boot. That boot is the slowest
  # the node ever does, and it is the only one where sleeping early is
  # unrecoverable: an image that never validates is reverted by the bootloader,
  # so the upload is silently lost and the node returns on the old firmware
  # with nothing in MQTT to say why. Such a boot falls back to run_duration.
  # Rollback still works as intended - an image that genuinely cannot report
  # still reverts.
  - id: connect_watchdog
    mode: single
    then:
      - delay: ${report_timeout_ms}ms
      - if:
          condition:
            lambda: |-
              return !id(report_ok) &&
                     !id(report_and_sleep).is_running() &&
                     !soil_ota_pending_verify() &&
                     !id(ota_hold) && !id(usb_hold) &&
                     !id(calibration_active) && !id(settings_active);
          then:
            # Last chance to notice a USB host before giving up: without this a
            # node with broken WiFi could never be held awake for a flash, which
            # is precisely when you need to reach it. One strict (3-window)
            # check per failed wake, bounded by usb_hold_timeout.
            - script.execute:
                id: usb_hold_update
                allow_acquire: true
            - if:
                condition:
                  lambda: 'return id(usb_hold);'
                then:
                  - logger.log: "No report, but a USB host is attached - staying awake for flashing"
                else:
                  - lambda: |-
                      id(failed_report_streak) += 1;
                      const uint32_t backoff = soil_offline_backoff_ms(
                          ${sleep_normal_ms}, id(failed_report_streak),
                          ${max_offline_sleep_ms});
                      // Log the radio state: "wifi=0" is a link/AP problem,
                      // "wifi=1" points at the broker. Serial only - with no
                      // MQTT the debug topic goes nowhere either.
                      ESP_LOGW("offline",
                               "No MQTT report within %u ms (wifi=%d, streak %d) - sleeping %u ms",
                               (unsigned) ${report_timeout_ms},
                               (int) esphome::wifi::global_wifi_component->is_connected(),
                               id(failed_report_streak), (unsigned) backoff);
                      id(next_sleep_ms) = (int) backoff;
                      id(deep_sleep_control).set_sleep_duration(backoff);
                  - script.execute: enter_sleep

  # ---- Absolute awake cap: the one timer that outranks every hold ----
  # run_duration is NOT a backstop. It is a one-shot timeout, and if anything
  # has called prevent_deep_sleep() when it fires, begin_sleep() merely latches
  # next_enter_deep_sleep_ and loop() spins forever. Every hold therefore needs
  # its own timeout, and this is the net under all of them.
  #
  # A confirmed live USB host defers the cap indefinitely: the board is bus
  # powered, there is no cell to protect, and force-sleeping would break bench
  # work and could land mid-flash.
  #
  # Deliberately NOT bounded. A bound does not protect: a detector stuck
  # reporting a host would burn the same awake current every wake and flatten
  # the cell regardless, so any bound loose enough to keep bench sessions
  # working is far too loose to save a battery. Firmware cannot resolve this;
  # the honest guard is the retained usb_hold binary_sensor, which lets the
  # controller alert a human that a node is holding when it should not be.
  #
  # MUST be a script delay, never `interval:`. An ESPHome interval does NOT
  # first fire one period after boot: scheduler.cpp schedules the first run at
  # `now + rand(0, min(period/2, MAX_INTERVAL_DELAY))`, MAX_INTERVAL_DELAY =
  # 5000 ms ("first execution happens immediately after a random smallish
  # offset"). A long `interval:` therefore fires within 5 s of EVERY boot and
  # then on its period, so it cannot express "time since boot" - as an interval
  # this cap would force-sleep a node seconds into a legitimate OTA hold.
  # set_timeout (a script delay) fires once at the delay, which is what we want.
  - id: awake_watchdog
    mode: single
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - delay: ${max_awake_ms}ms
            - if:
                condition:
                  lambda: 'return usb_host_present_confirmed();'
                then:
                  - logger.log:
                      level: WARN
                      format: "Awake watchdog: live USB host attached (bus powered) - not forcing sleep"
                else:
                  - lambda: |-
                      ESP_LOGE("awake_watchdog",
                               "Awake far too long (ota=%d usb=%d cal=%d settings=%d) - forcing sleep",
                               (int) id(ota_hold), (int) id(usb_hold),
                               (int) id(calibration_active), (int) id(settings_active));
                      id(ota_hold) = false;
                      id(usb_hold) = false;
                      id(calibration_active) = false;
                      id(settings_active) = false;
                      id(usb_hold_timeout).stop();
                      id(green_led).turn_off().perform();
                      id(usb_hold_active).publish_state(false);
                      id(deep_sleep_control).allow_deep_sleep();
                  # Clearing the local ota_hold is not enough: a retained "ON"
                  # would re-acquire it on the very next wake and loop this
                  # watchdog. ota_hold_timeout normally clears the topic at
                  # 10 min, so reaching here means that failed too.
                  - mqtt.publish:
                      topic: "${name}/ota"
                      payload: "OFF"
                      retain: true
                  - delay: 500ms
                  - script.execute: enter_sleep

  # ---- Guarded sleep: all explicit sleep points go through here ----
  # >=5 consecutive GPIO wakes = wet/stuck button. Sleep timer-only (button
  # disabled so the held pin can't instantly re-wake us) for a long backoff
  # (${stuck_backoff_ms} ms) instead of the normal reading interval: this caps a
  # shorted button at ~5 WiFi reports per backoff instead of an immediate
  # boot-report loop. Counts 1..5 still report first, so a real single press
  # works and the count>2 burst still fires the HA reboot-loop alert. Next timer
  # wake resets the counter, so it self-heals the moment the short clears.
  - id: enter_sleep
    then:
      - if:
          condition:
            lambda: 'return id(calibration_active) || id(settings_active);'
          then:
            - logger.log:
                format: "Calibration/settings update is active - refusing explicit sleep"
          else:
            - if:
                condition:
                  lambda: 'return soil_reported_rewake_backoff(id(rewake_guard_enabled), id(gpio_wake_count));'
                then:
                  - logger.log:
                      level: WARN
                      format: "Rapid GPIO re-wakes (wet/stuck button?) - timer-only backoff, button wake disabled"
                  - lambda: |-
                      esp_sleep_enable_timer_wakeup(${stuck_backoff_ms}ULL * 1000ULL);
                      global_preferences->sync();
                      esp_deep_sleep_start();
                else:
                  - deep_sleep.enter: deep_sleep_control

  # Retained OTA ON is a convenience, not permission to drain a cell forever.
  # A valid babysitter refreshes/releases the hold within minutes; if it dies,
  # this watchdog clears the local hold after 10 minutes and returns to sleep.
  # An upload plus exact-build verification takes tens of seconds once a node is
  # awake, so 10 min is ample for both an automated and a manual update.
  - id: ota_hold_timeout
    mode: restart
    then:
      - delay: 10min
      - if:
          condition:
            lambda: 'return id(ota_hold);'
          then:
            - lambda: 'id(ota_hold) = false;'
            - logger.log:
                level: WARN
                format: "OTA hold timed out after 10 minutes - releasing local hold"
            - mqtt.publish:
                topic: "${name}/ota"
                payload: "OFF"
                retain: true
            - delay: 500ms
            - if:
                condition:
                  lambda: 'return !id(usb_hold) && !id(calibration_active) && !id(settings_active);'
                then:
                  - deep_sleep.allow: deep_sleep_control
                  - script.execute: enter_sleep

  # ------------------- Calibration (3x button) -------------------
  - id: do_calibration
    mode: single
    then:
      - lambda: |-
          id(calibration_active) = true;
          if (!id(probe_powered)) {
            auto call = id(pwm_led).turn_on();
            call.set_brightness(0.68f);
            call.perform();
            id(probe_powered) = true;
          }
      - deep_sleep.prevent: deep_sleep_control
      - logger.log: "Starting calibration"
      - script.execute: red_led_blink
      - delay: 10s
      - script.stop: red_led_blink
      - lambda: |-
          float sum = 0.0f;
          bool valid = true;
          for (int i = 0; i < 10; i++) {
            id(soil_adc).update();
            const float sample = id(soil_adc).state;
            if (std::isfinite(sample)) {
              sum += sample;
            } else {
              valid = false;
            }
            delay(200);
          }
          id(calibration_dry_candidate) = valid ? sum / 10.0f : NAN;
          ESP_LOGI("calibration", "Dry candidate: %.3f V",
                   id(calibration_dry_candidate));
      - delay: 3s
      - script.execute: green_led_blink
      - delay: 10s
      - script.stop: green_led_blink
      - lambda: |-
          float sum = 0.0f;
          bool valid = true;
          for (int i = 0; i < 10; i++) {
            id(soil_adc).update();
            const float sample = id(soil_adc).state;
            if (std::isfinite(sample)) {
              sum += sample;
            } else {
              valid = false;
            }
            delay(200);
          }
          id(calibration_wet_candidate) = valid ? sum / 10.0f : NAN;
          ESP_LOGI("calibration", "Wet candidate: %.3f V",
                   id(calibration_wet_candidate));
      - delay: 3s
      - lambda: |-
          if (soil_calibration_valid(id(calibration_dry_candidate),
                                     id(calibration_wet_candidate))) {
            // Commit only after both phases pass validation. A failed second
            // phase can no longer destroy the last-known-good calibration.
            id(dry_value) = id(calibration_dry_candidate);
            id(wet_value) = id(calibration_wet_candidate);
            id(calibration_result_sensor).publish_state(
                "Physical calibration saved");
            id(fast_blink_green).execute();
            ESP_LOGI("calibration", "saved dry=%.3f V wet=%.3f V",
                     id(dry_value), id(wet_value));
          } else {
            id(calibration_result_sensor).publish_state(
                "Physical calibration rejected; previous values kept");
            id(fast_blink_red).execute();
            ESP_LOGW("calibration",
                     "rejected dry=%.3f V wet=%.3f V; previous values kept",
                     id(calibration_dry_candidate),
                     id(calibration_wet_candidate));
          }
      - delay: 3s
      - script.execute: check_moisture_once
      - script.wait: check_moisture_once
      - script.execute: publish_calibration_diagnostics
      - delay: 1200ms
      - lambda: 'id(calibration_active) = false;'
      - if:
          condition:
            lambda: 'return !id(ota_hold) && !id(usb_hold) && !id(settings_active);'
          then:
            - deep_sleep.allow: deep_sleep_control
            - script.execute: enter_sleep
          else:
            - logger.log: "Calibration complete; OTA/USB hold remains active"

  # --------- Wake -> report -> sleep (driven by MQTT connect) ---------
  - id: report_and_sleep
    mode: single
    then:
      - delay: 500ms                     # let retained OTA/settings topics arrive first
      - if:
          condition:
            lambda: 'return !id(calibration_active);'
          then:
            - script.execute: check_moisture_once
            - script.wait: check_moisture_once
          else:
            - logger.log: "Physical/remote calibration active - report path will not interrupt it"
      # The voltage and die temperature were sampled before WiFi initialization.
      # Re-publish them now that MQTT is connected, then derive battery percentage
      # from the same voltage sample.
      - lambda: |-
          id(battery_voltage).publish_state(id(battery_voltage).state);
          id(battery_sensor).publish_state(alkaline_aa_percent(id(battery_voltage).state));
          if (std::isfinite(id(mcu_temperature).state)) {
            id(mcu_temperature).publish_state(id(mcu_temperature).state);
          }
      - component.update: wifi_sig
      - lambda: 'id(wake_count_sensor).publish_state(id(gpio_wake_count));'
      - script.execute: publish_calibration_diagnostics
      - script.execute: migrate_rewake_guard_discovery
      - script.execute: publish_device_diagnostics
      # Boot reached WiFi+MQTT and reported: reset the unconditional no-report
      # backstop and mark the app valid. The one-second flush delay persists the
      # restored counter before sleep. Early validation prevents OTA rollback.
      - lambda: |-
          id(failed_gpio_wake_count) = 0;
          id(failed_report_streak) = 0;   // clears the offline backoff ladder
          id(report_ok) = true;           // disarms connect_watchdog
          id(safe_mode_ctrl).mark_successful();
      - delay: 1s                        # let MQTT flush the publishes
      # The ONLY place a USB hold may be acquired - see usb_hold_update.
      - script.execute:                  # single-lambda script: completes inline
          id: usb_hold_update
          allow_acquire: true
      - if:
          condition:
            lambda: 'return id(ota_hold) || id(usb_hold) || id(calibration_active) || id(settings_active);'
          then:
            - logger.log: "OTA/USB/calibration/settings hold active - staying awake"
            - deep_sleep.prevent: deep_sleep_control
          else:
            - script.execute: enter_sleep

binary_sensor:
  - platform: template
    id: soil_sensor_fault
    name: "Soil sensor fault"
    device_class: problem
    entity_category: diagnostic
    # Each wake creates a fresh template sensor. Without this, ESPHome accepts
    # the first healthy OFF state internally but suppresses its MQTT callback,
    # leaving both the discovered entity and any fixed-ID MQTT monitor
    # subscribed to it stuck at "unknown".
    trigger_on_initial_state: true

  # The USB hold was the only sleep-blocking hold with no HA visibility, which
  # is why a wedged one could only be found with a power analyser. Retained, so
  # a node that dies holding leaves "ON" behind for an HA automation to catch.
  - platform: template
    id: usb_hold_active
    name: "USB hold"
    device_class: plug
    entity_category: diagnostic
    trigger_on_initial_state: true

interval:
  # Release half of the USB hold only (see usb_hold_update). This is a no-op
  # when no hold is held, so battery wakes no longer pay a blocking poll.
  - interval: 5s
    then:
      - script.execute:
          id: usb_hold_update
          allow_acquire: false
deep_sleep:
  id: deep_sleep_control
  # NOT a safety cap. run_duration is a ONE-SHOT timeout: if any hold has
  # called prevent_deep_sleep() when it fires, begin_sleep() only latches
  # next_enter_deep_sleep_ and loop() spins until allow_deep_sleep() is called
  # (deep_sleep_component.cpp). It closes a wake only while nothing holds.
  # The real backstops are connect_watchdog, each hold's own timeout, and
  # awake_watchdog above.
  run_duration: 30s
  sleep_duration: 8h          # default; overridden per reading

sensor:
  - platform: adc
    id: soil_adc
    pin: GPIO1
    internal: true
    attenuation: 12db
    samples: 8                # hardware oversampling in one update()
    update_interval: never    # manual .update() only

  # One published value per wake: the mean of five ADC updates (40 hardware
  # conversions total). Keeping the raw ADC internal avoids five MQTT states
  # while preserving averaging and a stable timestamp for drain monitoring.
  - platform: template
    id: soil_sensor
    name: "Soil moisture (raw)"
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  # Raw cell voltage, sampled once at boot before WiFi starts and re-published
  # after MQTT connects. Percentage is derived and saturates at both ends, so
  # trend volts to see the cell aging.
  - platform: adc
    id: battery_voltage
    pin: GPIO0
    name: "Battery voltage"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 4
    update_interval: never

  # ESP32-C6 die temperature, sampled once immediately after a long deep sleep
  # and before WiFi. It is a local temperature trend/correlation input, not a
  # calibrated ambient-temperature measurement.
  - platform: internal_temperature
    id: mcu_temperature
    name: "MCU temperature"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never

  # Derived from the voltage via the alkaline AA curve in packages/battery_curve.h.
  # Keeps the "Battery" name (MQTT topic + HA entity) from the old ADC sensor.
  - platform: template
    id: battery_sensor
    name: "Battery"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never    # published from report_and_sleep

  - platform: wifi_signal
    id: wifi_sig
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: wake_count_sensor    # consecutive GPIO wakes, published each report; >2 = re-wake loop
    name: "Button wake count"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:gesture-tap-button
    update_interval: never   # published from report_and_sleep

  - platform: template
    id: calibration_dry_sensor
    name: "Calibration dry"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: calibration_wet_sensor
    name: "Calibration wet"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: calibration_span_sensor
    name: "Calibration span"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: next_sleep_sensor
    name: "Next sleep"
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

switch:
  - platform: template
    id: rewake_guard_switch
    name: "Rewake guard"
    entity_category: config
    lambda: 'return id(rewake_guard_enabled);'
    restore_mode: DISABLED   # restored global owns state; never fire OFF during setup
    state_topic: "${name}/settings/rewake_guard/state"
    command_topic: "${name}/settings/rewake_guard/command"
    command_retain: true
    retain: true
    turn_on_action:
      - script.execute:
          id: request_rewake_guard_setting
          enabled: true
          source: "Home Assistant"
    turn_off_action:
      - script.execute:
          id: request_rewake_guard_setting
          enabled: false
          source: "Home Assistant"

text_sensor:
  - platform: template
    id: soil_status
    name: "Soil Moisture Status"
    update_interval: never    # published from check_moisture_once

  - platform: template
    id: calibration_result_sensor
    name: "Calibration command result"
    entity_category: diagnostic
    update_interval: never


  - platform: template
    id: settings_result_sensor
    name: "Settings command result"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: firmware_build_sensor
    name: "Firmware build"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: wake_reason_sensor
    name: "Wake reason"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: reset_reason_sensor
    name: "Reset reason"
    entity_category: diagnostic
    update_interval: never

logger:                       # keep serial for USB flashing/debug (negligible on a brief wake)

safe_mode:
  id: safe_mode_ctrl          # referenced by report_and_sleep to validate OTA images pre-sleep

ota:
  - platform: esphome

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery_unique_id_generator: mac   # default 'legacy' collides across devices -> HA ignores 2nd+ device
  enable_on_boot: false       # enabled from wifi.on_connect: skips the client's 5s retry gate
  reboot_timeout: 0s          # don't reboot if broker is down; run_duration handles it
  birth_message:              # empty = disabled, so entities stay "available" (retained) while asleep
  will_message:
  shutdown_message:           # empty = don't publish "offline" on deep sleep
  on_connect:
    - script.execute: report_and_sleep
  on_message:
    - topic: "${name}/ota"     # publish retained "ON" here to hold the device awake for OTA
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - lambda: 'id(ota_hold) = true;'
              - deep_sleep.prevent: deep_sleep_control
              - script.execute: ota_hold_timeout
            else:
              - if:
                  condition:
                    lambda: 'return id(ota_hold);'   # ON -> OFF transition: release and sleep now
                  then:
                    - lambda: 'id(ota_hold) = false;'
                    - script.stop: ota_hold_timeout
                    - logger.log: "OTA hold released - sleeping"
                    - if:
                        condition:
                          lambda: 'return !id(usb_hold) && !id(calibration_active) && !id(settings_active);'
                        then:
                          - deep_sleep.allow: deep_sleep_control
                          - script.execute: enter_sleep

    # Retained one-shot command, so sleeping/buttonless nodes can be repaired:
    #   RESET
    #   SET <dry-volts> <wet-volts>     e.g. SET 2.750 1.200
    # The device validates, persists, reports the result, then deletes the
    # retained command by publishing an empty retained payload.
    - topic: "${name}/calibration/command"
      then:
        - if:
            condition:
              lambda: 'return !x.empty();'   # ignore our retained-delete echo
            then:
              - if:
                  condition:
                    lambda: 'return id(calibration_active) || id(settings_active);'
                  then:
                    - lambda: |-
                        id(calibration_result_sensor).publish_state(
                            "Rejected: another calibration/settings update is active");
                    - mqtt.publish:
                        topic: "${name}/calibration/command"
                        payload: ""
                        retain: true
                  else:
                    - lambda: |-
                        id(calibration_active) = true;
                        id(deep_sleep_control).prevent_deep_sleep();

                        std::string command = x;
                        while (!command.empty() &&
                               std::isspace(static_cast<unsigned char>(command.front()))) {
                          command.erase(command.begin());
                        }
                        while (!command.empty() &&
                               std::isspace(static_cast<unsigned char>(command.back()))) {
                          command.pop_back();
                        }

                        float dry = NAN;
                        float wet = NAN;
                        char extra = '\0';
                        bool reset = command == "RESET";
                        bool set = std::sscanf(command.c_str(), "SET %f %f %c",
                                               &dry, &wet, &extra) == 2;
                        if (reset) {
                          dry = ${dry_init};
                          wet = ${wet_init};
                        }

                        char result[128];
                        if ((reset || set) && soil_calibration_valid(dry, wet)) {
                          id(dry_value) = dry;
                          id(wet_value) = wet;
                          std::snprintf(
                              result, sizeof(result),
                              "%s saved: dry=%.3f V wet=%.3f V",
                              reset ? "RESET" : "SET", dry, wet);
                          ESP_LOGI("calibration", "%s", result);
                        } else {
                          std::snprintf(
                              result, sizeof(result),
                              "Rejected '%s': use RESET or SET <dry> <wet>; "
                              "dry-wet must be >=0.150 V within 0..3.3 V",
                              command.c_str());
                          ESP_LOGW("calibration", "%s", result);
                        }
                        id(calibration_result_sensor).publish_state(result);
                    # Restored globals flush changed values every second. Wait
                    # through one full poll before acknowledging and sleeping.
                    - delay: 1200ms
                    - script.execute: check_moisture_once
                    - script.wait: check_moisture_once
                    - script.execute: publish_calibration_diagnostics
                    - script.execute: publish_device_diagnostics
                    - mqtt.publish:
                        topic: "${name}/calibration/command"
                        payload: ""
                        retain: true
                    - lambda: 'id(calibration_active) = false;'
                    - if:
                        condition:
                          lambda: 'return !id(ota_hold) && !id(usb_hold) && !id(settings_active);'
                        then:
                          - deep_sleep.allow: deep_sleep_control
                          # If report_and_sleep already saw the calibration hold,
                          # it will not retry sleep itself. Give its publishes
                          # time to flush, then close this wake explicitly.
                          - delay: 1500ms
                          - script.execute: enter_sleep

    # Generic retained one-shot settings command:
    #   SET REWAKE_GUARD ON
    #   SET REWAKE_GUARD OFF
    #   RESET REWAKE_GUARD
    # The Home Assistant config switch uses the same persistence script.
    - topic: "${name}/settings/command"
      then:
        - if:
            condition:
              lambda: 'return !x.empty();'   # ignore our retained-delete echo
            then:
              - if:
                  condition:
                    lambda: |-
                      const auto command = soil_parse_setting_command(x);
                      const bool is_rewake_guard =
                          std::strcmp(command.key, "REWAKE_GUARD") == 0;
                      const bool valid_set =
                          command.action == SoilSettingAction::SET &&
                          (std::strcmp(command.value, "ON") == 0 ||
                           std::strcmp(command.value, "OFF") == 0);
                      return is_rewake_guard &&
                             (valid_set ||
                              command.action == SoilSettingAction::RESET);
                  then:
                    - script.execute:
                        id: request_rewake_guard_setting
                        enabled: !lambda |-
                          const auto command = soil_parse_setting_command(x);
                          if (command.action == SoilSettingAction::RESET) {
                            return ${rewake_guard_default};
                          }
                          return std::strcmp(command.value, "ON") == 0;
                        source: !lambda |-
                          const auto command = soil_parse_setting_command(x);
                          return command.action == SoilSettingAction::RESET
                                     ? std::string("RESET")
                                     : std::string("SET");
                  else:
                    - lambda: |-
                        char result[160];
                        std::snprintf(
                            result, sizeof(result),
                            "Rejected '%s': use SET REWAKE_GUARD <ON|OFF> "
                            "or RESET REWAKE_GUARD",
                            x.c_str());
                        id(settings_result_sensor).publish_state(result);
                        ESP_LOGW("settings", "%s", result);
                    - mqtt.publish:
                        topic: "${name}/settings/command"
                        payload: ""
                        retain: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - mqtt.enable             # connect immediately now that the network is up
  fast_connect: true          # skip full scan -> faster wake connect
  power_save_mode: none       # modem-sleep breaks async MQTT inbound (ota-hold release, LED cmds)
  reboot_timeout: 0s          # deep-sleep friendly: sleep instead of reboot on wifi loss
  manual_ip:                  # static -> skip DHCP each wake (battery)
    static_ip: "${static_ip}"
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: !secret wifi_dns
  ap:
    ssid: "setup-${name}"
    # A SoftAP + captive portal on a battery node is pure drain and nobody is
    # there to use it. Keep the fallback past report_timeout_ms (20 s) and
    # run_duration (30 s) so a failed wake always deep-sleeps first. Default
    # is 90 s, which already clears both; this pins it against that changing.
    ap_timeout: 5min

captive_portal:
