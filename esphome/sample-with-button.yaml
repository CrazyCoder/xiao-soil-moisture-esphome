# Sample device: the CN4 button is present
#
# Copy this file for each plant. Give each device a different name and IP
# address. Flash the first time over USB: hold BOOT while you connect the
# cable. Later updates go over OTA. Refer to "Updating firmware" in the README.

substitutions:
  name: "plant-1"
  friendly_name: "Soil - Plant 1"
  static_ip: "192.168.1.61"

  # Optional. The defaults are in the base package.
  # sleep_normal_ms:     "7200000"   #  2 h - detect Almost Dry within 2 h
  # sleep_almost_dry_ms: "3600000"   #  1 h - detect Dry within 1 h
  # sleep_dry_ms:       "14400000"   #  4 h - confirm watering within 4 h
  # rewake_guard_default: "true"  # "false" starts with button protection off
  # external_antenna:       "true"   # "false" if the u.FL antenna is removed
  # dry_init: "2.75"                 # per-probe calibration seed
  # wet_init: "1.2"

packages:
  base: !include packages/xiao-soil-moisture-monitor.base.yaml
  button: !include packages/xiao-soil-moisture-button.yaml
